import org.objectweb.asm.*
import org.objectweb.asm.tree.*
import org.objectweb.asm.commons.*
import java.util.zip.*
import java.io.*
import java.nio.charset.StandardCharsets
import java.util.Random

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/accesswidener")
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.3")))

    // Java-WebSocket
    include(implementation("org.java-websocket:Java-WebSocket:1.5.4"))

    // Netty proxy & socks
    include(implementation("io.netty:netty-codec-socks:4.1.82.Final"))
    include(implementation("io.netty:netty-handler-proxy:4.1.82.Final"))

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.debug = false
    it.options.compilerArgs += ['-g:none', '-parameters']
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Production-Grade Obfuscation & Package Dispersion Pipeline (prompt.txt compliance)
tasks.register('obfuscateJar') {
    dependsOn 'remapJar'
    doLast {
        File jarFile = remapJar.archiveFile.get().asFile
        if (!jarFile.exists()) return

        println "[Obfuscator] Running Multi-Layer Obfuscation & Package Dispersion on ${jarFile.name}..."
        File tempFile = new File(jarFile.parentFile, jarFile.name + ".temp")

        int encryptedStringCount = 0
        int transformedClasses = 0
        int SEED = 0x5F3759DF
        Random random = new Random()

        // Read all entries into memory
        Map<String, byte[]> entries = new LinkedHashMap<>()
        ZipInputStream zis = new ZipInputStream(new FileInputStream(jarFile))
        ZipEntry entry
        while ((entry = zis.getNextEntry()) != null) {
            entries.put(entry.name, zis.readAllBytes())
            zis.closeEntry()
        }
        zis.close()

        // 1. Build Package / Namespace Dispersion Mapping Table
        Map<String, String> mappings = new HashMap<>()
        String[] dispersedPrefixes = [
            "code/elixir/v1/net",
            "code/elixir/core/sys",
            "code/elixir/impl/io",
            "code/elixir/res/data",
            "code/elixir/drv/mem",
            "code/elixir/pipe/flow",
            "code/elixir/sec/auth",
            "code/elixir/lib/util"
        ]

        int classIndex = 0
        for (String name : entries.keySet()) {
            if (name.endsWith(".class") && name.startsWith("code/elixir/")) {
                String internalName = name.substring(0, name.length() - 6)
                
                // Exclude entrypoints, mixins, annotations, and core interfaces
                boolean isExcluded = internalName.equals("code/elixir/Elixir") ||
                                     internalName.equals("code/elixir/common/proxy/ProxyServer") ||
                                     internalName.startsWith("code/elixir/mixins/") ||
                                     internalName.equals("code/elixir/utils/protection/ProtectionRuntime") ||
                                     internalName.contains("EventHandler")

                if (!isExcluded && !internalName.contains('$')) {
                    String prefix = dispersedPrefixes[Math.abs(internalName.hashCode()) % dispersedPrefixes.length]
                    String complexSub = Integer.toHexString((int)((internalName.hashCode() ^ 0x5EADBEEF) & 0xFFFF))
                    String complexName = "Cl_" + Integer.toHexString((int)((classIndex * 31 ^ 0x5AFEBABE) & 0xFFFFFF))
                    String dispersedName = prefix + "/d_" + complexSub + "/" + complexName
                    mappings.put(internalName, dispersedName)
                    classIndex++
                }
            }
        }

        // Map inner classes according to their outer class mapping
        for (String name : entries.keySet()) {
            if (name.endsWith(".class") && name.startsWith("code/elixir/")) {
                String internalName = name.substring(0, name.length() - 6)
                if (internalName.contains('$')) {
                    int lastDollar = internalName.lastIndexOf('$')
                    String outerName = internalName.substring(0, lastDollar)
                    String innerPart = internalName.substring(lastDollar)
                    if (mappings.containsKey(outerName)) {
                        mappings.put(internalName, mappings.get(outerName) + innerPart)
                    }
                }
            }
        }

        SimpleRemapper remapper = new SimpleRemapper(mappings)

        // 2. Transform and Remap Classes
        Map<String, byte[]> outputEntries = new LinkedHashMap<>()
        for (Map.Entry<String, byte[]> e : entries.entrySet()) {
            String name = e.getKey()
            byte[] bytes = e.getValue()

            if (name.endsWith(".class") && name.startsWith("code/elixir/")) {
                String internalName = name.substring(0, name.length() - 6)
                try {
                    ClassReader cr = new ClassReader(bytes)
                    ClassNode cn = new ClassNode()
                    cr.accept(cn, 0)

                    boolean isAnnotation = (cn.access & Opcodes.ACC_ANNOTATION) != 0
                    boolean isInterface = (cn.access & Opcodes.ACC_INTERFACE) != 0
                    boolean isEnum = (cn.access & Opcodes.ACC_ENUM) != 0
                    boolean isMixin = name.contains("mixins/")
                    boolean isSpecial = name.equals("code/elixir/Elixir.class") || name.equals("code/elixir/common/proxy/ProxyServer.class") || name.contains("EventHandler") || isMixin

                    // Metadata Cleanup & Debug Symbol Stripping
                    cn.sourceFile = null
                    cn.sourceDebug = null

                    if (!isAnnotation && !isInterface && !isEnum && !isSpecial) {
                        cn.access |= Opcodes.ACC_SYNTHETIC
                    }

                    // Method-level transformations
                    for (MethodNode mn : cn.methods) {
                        if (mn.localVariables != null) mn.localVariables.clear()
                        if (mn.parameters != null) mn.parameters.clear()

                        boolean hasAnnotations = (mn.visibleAnnotations != null && !mn.visibleAnnotations.isEmpty()) || (mn.invisibleAnnotations != null && !mn.invisibleAnnotations.isEmpty())

                        if (!isAnnotation && !isInterface && !isMixin && !hasAnnotations && !mn.name.equals("<init>") && !mn.name.equals("<clinit>") && !mn.name.equals("onInitialize")) {
                            mn.access |= Opcodes.ACC_SYNTHETIC
                        }

                        // String Encryption (Skip in mixins & annotations)
                        if (!isAnnotation && !isMixin) {
                            ListIterator<AbstractInsnNode> iterator = mn.instructions.iterator()
                            while (iterator.hasNext()) {
                                AbstractInsnNode insn = iterator.next()
                                if (insn.opcode == Opcodes.LDC) {
                                    LdcInsnNode ldc = (LdcInsnNode) insn
                                    if (ldc.cst instanceof String) {
                                        String raw = (String) ldc.cst
                                        if (raw.length() > 0 && raw.length() < 2000) {
                                            int key = (name.hashCode() ^ mn.name.hashCode() ^ raw.hashCode() ^ random.nextInt(100000)) & 0x7FFFFFFF
                                            byte[] rawBytes = raw.getBytes(StandardCharsets.UTF_8)
                                            
                                            if ((key & 1) == 0) {
                                                StringBuilder hex = new StringBuilder()
                                                for (int i = 0; i < rawBytes.length; i++) {
                                                    int k = (key ^ (i * 31 + SEED)) & 0xFF
                                                    int enc = (rawBytes[i] ^ k) & 0xFF
                                                    if (enc < 16) hex.append("0")
                                                    hex.append(Integer.toHexString(enc))
                                                }

                                                InsnList list = new InsnList()
                                                list.add(new LdcInsnNode(hex.toString()))
                                                list.add(new LdcInsnNode(key))
                                                list.add(new MethodInsnNode(
                                                    Opcodes.INVOKESTATIC,
                                                    "code/elixir/utils/protection/ProtectionRuntime",
                                                    "decrypt",
                                                    "(Ljava/lang/String;I)Ljava/lang/String;",
                                                    false
                                                ))

                                                mn.instructions.insertBefore(insn, list)
                                                iterator.remove()
                                                encryptedStringCount++
                                            } else {
                                                InsnList list = new InsnList()
                                                list.add(new LdcInsnNode(rawBytes.length))
                                                list.add(new IntInsnNode(Opcodes.NEWARRAY, Opcodes.T_INT))

                                                for (int i = 0; i < rawBytes.length; i++) {
                                                    int k = (key ^ (i * 17 + SEED)) & 0xFF
                                                    int enc = (rawBytes[i] ^ k) & 0xFF
                                                    list.add(new InsnNode(Opcodes.DUP))
                                                    list.add(new LdcInsnNode(i))
                                                    list.add(new LdcInsnNode(enc))
                                                    list.add(new InsnNode(Opcodes.IASTORE))
                                                }

                                                list.add(new LdcInsnNode(key))
                                                list.add(new MethodInsnNode(
                                                    Opcodes.INVOKESTATIC,
                                                    "code/elixir/utils/protection/ProtectionRuntime",
                                                    "decryptArray",
                                                    "([II)Ljava/lang/String;",
                                                    false
                                                ))

                                                mn.instructions.insertBefore(insn, list)
                                                iterator.remove()
                                                encryptedStringCount++
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // Apply Remapper for Namespace Dispersion
                    ClassWriter cw = new ClassWriter(ClassWriter.COMPUTE_MAXS)
                    ClassRemapper classRemapper = new ClassRemapper(cw, remapper)
                    cn.accept(classRemapper)
                    byte[] transformedBytes = cw.toByteArray()

                    String newEntryName = (mappings.containsKey(internalName) ? mappings.get(internalName) : internalName) + ".class"
                    outputEntries.put(newEntryName, transformedBytes)
                    transformedClasses++
                    continue
                } catch (Exception ex) {
                    println "Warning: Preserving original for ${name}: ${ex.message}"
                }
            }

            outputEntries.put(name, bytes)
        }

        // 3. Write Protected & Dispersed Jar
        ZipOutputStream zos = new ZipOutputStream(new FileOutputStream(tempFile))
        for (Map.Entry<String, byte[]> outEntry : outputEntries.entrySet()) {
            ZipEntry ze = new ZipEntry(outEntry.getKey())
            zos.putNextEntry(ze)
            zos.write(outEntry.getValue())
            zos.closeEntry()
        }
        zos.close()

        jarFile.delete()
        tempFile.renameTo(jarFile)
        println "[Obfuscator] Successfully dispersed ${mappings.size()} client classes across complex namespaces and encrypted ${encryptedStringCount} strings!"
    }
}

assemble.dependsOn obfuscateJar
